<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Recibos</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <!-- Logo -->
                        <img src="img/logo.png" id="logo" class="img-fluid mb-3" style="max-height:90px;">

                        <h2 class="fw-bold text-success">
                            Sistema de Recibos
                        </h2>

                        <p class="text-muted">
                            Preencha os dados abaixo para emitir o recibo.
                        </p>

                    </div>

                    <form id="formRecibo">

                        <div class="row">

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Data
                                </label>

                                <input
                                    type="date"
                                    id="data"
                                    class="form-control">

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Nome do Pagador
                            </label>

                            <input
                                type="text"
                                id="pagador"
                                class="form-control"
                                placeholder="Digite o nome">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Nome do Recebedor
                            </label>

                            <input
                                type="text"
                                id="recebedor"
                                class="form-control"
                                placeholder="Digite o nome">

                        </div>

                        <div class="row">

                            <div class="col-md-4 mb-3">

                                <label class="form-label">
                                    Valor
                                </label>

                                <input
                                    type="text"
                                    id="valor"
                                    class="form-control"
                                    placeholder="R$ 0,00">

                            </div>

                            <div class="col-md-8 mb-3">

                                <label class="form-label">
                                    Valor por extenso
                                </label>

                                <input
                                    type="text"
                                    id="extenso"
                                    class="form-control bg-light"
                                    readonly>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Referente a
                            </label>

                            <textarea
                                id="referente"
                                rows="3"
                                class="form-control"
                                placeholder="Descreva o motivo do pagamento"></textarea>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Cidade
                            </label>

                            <input
                                type="text"
                                id="cidade"
                                class="form-control"
                                placeholder="Ex.: Joinville">

                        </div>

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-success btn-lg">

                                Gerar Recibo

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/extenso.js"></script>
<script src="js/app.js"></script>

</body>
</html>
